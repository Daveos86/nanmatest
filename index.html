<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nanma’s little makes</title><meta name="description" content="Handmade with love, one stitch at a time"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧵%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#4a3f45;--mut:#8a7c84;--pink:#e98a95;--teal:#4fa6a1;--line:#f0dfd6;--soft:#fdeceb;--btn:#d96b7c;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1a1d;--card:#2a2328;--ink:#f3e9ee;--mut:#b9a9b2;--pink:#ef9aa5;--teal:#6cc3bd;--line:#3b3238;--soft:#35282d;--btn:#ef9aa5;--btnt:#2a1a20}}
:root[data-theme=dark]{--bg:#1f1a1d;--card:#2a2328;--ink:#f3e9ee;--mut:#b9a9b2;--pink:#ef9aa5;--teal:#6cc3bd;--line:#3b3238;--soft:#35282d;--btn:#ef9aa5;--btnt:#2a1a20}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Quicksand,system-ui,sans-serif}
.w{max-width:1080px;margin:0 auto;padding:16px}.hero{width:100%;border-radius:16px;display:block}
h1,h2{font-family:'Dancing Script',cursive;color:var(--pink);margin:.3em 0}h1{font-size:2.2rem}
.tag{text-align:center;color:var(--teal);font-weight:600;margin:10px 0}.notice{background:var(--soft);border-radius:12px;padding:10px 14px;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:120px}
.chip,.btn,.btn2,.lnk{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;text-decoration:none;display:inline-block}
.chip.on,.btn{background:var(--btn);color:var(--btnt);border-color:var(--btn);font-weight:700}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--btn);color:var(--btnt);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{margin:0;font-size:1.05rem}.pr{color:var(--teal);font-weight:700;font-size:1.1rem}.d{color:var(--mut);font-size:.9rem;flex:1;white-space:pre-line}
.pg{display:flex;gap:6px;justify-content:center;margin:20px 0;flex-wrap:wrap}.mut{color:var(--mut);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label{display:block;font-weight:600;font-size:.9rem;margin:8px 0}label input,label select,label textarea{font-weight:400;margin-top:4px}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.item img,.item .t0{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none;text-align:center;line-height:48px}.item .g{flex:1;min-width:0}.item input[type=checkbox]{width:auto}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.th{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:8px}.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.pub{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--btn);color:var(--btnt);padding:8px 16px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.pub button{font:inherit;border-radius:999px;border:0;padding:4px 14px;cursor:pointer;font-weight:700}
footer{text-align:center;color:var(--mut);padding:24px 0}footer a{color:var(--teal)}
</style></head><body><div id="root"></div>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GH={tok:()=>sessionStorage.gh||localStorage.gh||'',repo:()=>sessionStorage.ghr||localStorage.ghr||''};
const gh=(p,o={})=>fetch('https://api.github.com/repos/'+GH.repo()+p,{...o,headers:{Authorization:'Bearer '+GH.tok(),Accept:'application/vnd.github+json',...(o.headers||{})}});
let S=await fetch('data.json?'+Date.now()).then(r=>r.json()).catch(()=>({settings:{name:'Shop',perPage:12,hero:''},products:[]})),isAdmin=!!(GH.tok()&&GH.repo()),artifact=null,dirty=false,msg='';
if(isAdmin)try{const r=await gh('/contents/data.json',{headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok)S=await r.json()}catch(e){}
if(!S.settings.categories)S.settings.categories=[...new Set(S.products.map(p=>p.cat).filter(Boolean))];
let q={page:1,cat:'',s:'',pp:0},aq={page:1,s:'',sel:new Set(),tab:'list',edit:null};
const st=()=>S.settings,money=n=>{try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:st().currency||'AUD'}).format(n||0)}catch(e){return '$'+(+n||0).toFixed(2)}};
const soldv=s=>s!==''&&s!==null&&s!==undefined&&+s<=0,sold=p=>soldv(p.stock),live=()=>S.products.filter(p=>p.status!='hidden'),sel={},has=v=>v!==''&&v!==null&&v!==undefined;
const em=()=>(st().enquiryEmail||st().contact||'').trim(),mail=(sub,body)=>{const a=document.createElement('a');a.href='mailto:'+em()+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
function eff(p){const o=(p.opts||[])[sel[p.id]||0]||null;return{o,price:o&&has(o.price)?+o.price:+p.price,stock:o&&has(o.stock)?o.stock:p.stock,link:((o&&o.link)||p.link||st().stripeLink||'').trim(),img:(o&&has(o.img)&&p.imgs[+o.img])||p.imgs[0]}}
const link=p=>(p.link||st().stripeLink||'').trim();
function pager(n,cur,a){if(n<2)return '';let h='<div class=pg>';for(let i=1;i<=n;i++)h+=`<button class="chip ${i==cur?'on':''}" data-a="${a}" data-v="${i}">${i}</button>`;return h+'</div>'}
function shop(){const ps=live(),cats=(st().categories||[]).filter(c=>!(st().catsOff||[]).includes(c));
let l=ps.filter(p=>(!q.cat||p.cat==q.cat)&&(!q.s||(p.title+' '+p.desc).toLowerCase().includes(q.s.toLowerCase()))).sort((a,b)=>!!b.featured-!!a.featured);
const pp=q.pp||+st().perPage||12,n=Math.max(1,Math.ceil(l.length/pp));q.page=Math.min(q.page,n);const v=l.slice((q.page-1)*pp,q.page*pp);
const opts=String(st().perPageOptions||'').split(',').map(x=>+x.trim()).filter(Boolean);
return `<div class=w><img class=hero src="${esc(st().hero)}" alt="${esc(st().name)}"><div class=tag>${esc(st().tagline)}</div>${st().notice?`<div class=notice>${esc(st().notice)}</div>`:''}
<div class=bar><input id=qs type=search placeholder="Search makes…" value="${esc(q.s)}" data-c=search><select data-c=pp>${[pp,...opts].filter((x,i,a)=>a.indexOf(x)==i).sort((a,b)=>a-b).map(o=>`<option value=${o} ${o==pp?'selected':''}>${o} per page</option>`).join('')}</select></div>
${cats.length?`<div class=bar><button class="chip ${q.cat?'':'on'}" data-a=cat data-v="">All</button>${cats.map(c=>`<button class="chip ${q.cat==c?'on':''}" data-a=cat data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
${v.length?`<div class=grid>${v.map(card).join('')}</div>`:'<p class=tag>Nothing here just yet — check back soon!</p>'}${pager(n,q.page,'page')}
<footer>${st().contact?`Questions? <a href="mailto:${esc(st().contact)}">${esc(st().contact)}</a><br>`:''}Payments handled securely by Stripe${isAdmin?' · <a href="#admin">Shop admin</a>':''}</footer></div>`}
function card(p){const e=eff(p),so=soldv(e.stock),os=p.opts||[];return `<div class=card><div class=ph>${e.img?`<img src="${e.img}" alt="${esc(p.title)}" loading=lazy>`:'🧵'}${so?'<span class=badge>Sold out</span>':p.featured?'<span class=badge>Featured</span>':p.custom?'<span class=badge>Custom available</span>':''}</div><div class=cb><h3>${esc(p.title)}</h3><div class=pr>${money(e.price)}</div><div class=d>${esc(p.desc)}</div>${os.length?`<select data-c=opt data-v="${p.id}">${os.map((o,i)=>`<option value=${i} ${i==(sel[p.id]||0)?'selected':''}>${esc(o.name)}${soldv(has(o.stock)?o.stock:p.stock)?' (sold out)':''}</option>`).join('')}</select>`:''}${p.custom?`${p.customNote?`<div class=mut>${esc(p.customNote)}</div>`:''}<textarea id="c_${p.id}" rows=3 placeholder="Describe your custom design — colours, fabrics, names…"></textarea><button class=btn2 data-a=custom data-v="${p.id}">Send custom request</button>`:''}${so?'<button class=btn disabled>Sold out</button>':e.link?`<a class=btn href="${esc(e.link)}" target=_blank rel=noopener>${p.custom?'Buy as shown':'Buy now'}</a>`:p.custom?'':`<button class=btn2 data-a=enq data-v="${p.id}">Enquire</button>`}</div></div>`}
function guess(){const h=location.hostname,r=location.pathname.split('/')[1];return h.endsWith('github.io')?(r?h.split('.')[0]+'/'+r:h):''}
function admin(){if(!isAdmin)return `<div class=w><div class=panel><h2>Admin sign-in</h2><p class=mut>Enter your GitHub repository and an access token that has “Contents: Read and write” permission for it.</p><label>Repository<input id=ghrepo placeholder="username/repo" value="${esc(guess())}"></label><label>Access token<input id=ghtok type=password autocomplete=off></label><label class=chk><input id=ghrem type=checkbox> Remember on this device</label><div class=row><button class=btn data-a=signin>Sign in</button><a class=lnk href="#">Back to shop</a></div></div></div>`;if(!ok())return `<div class=w><div class=panel><h2>Admin locked</h2><label>PIN<input id=pin type=password autocomplete=off></label><div class=row><button class=btn data-a=unlock>Unlock</button><a class=lnk href="#">Back to shop</a></div></div></div>`;
return `<div class=w><div class=row><h1>Shop admin</h1><a class=lnk href="#">View shop</a><button class="chip ${aq.tab=='list'?'on':''}" data-a=tab data-v=list>Listings</button><button class="chip ${aq.tab=='set'?'on':''}" data-a=tab data-v=set>Settings & Stripe</button><button class=chip data-a=signout>Sign out</button></div>${msg?`<div class=notice>${esc(msg)}</div>`:''}${aq.edit?form(aq.edit):aq.tab=='set'?settings():list()}</div>`}
function list(){let l=S.products.filter(p=>!aq.s||(p.title+p.cat).toLowerCase().includes(aq.s.toLowerCase()));const pp=+st().adminPerPage||10,n=Math.max(1,Math.ceil(l.length/pp));aq.page=Math.min(aq.page,n);
return `<div class=bar><input type=search placeholder="Search listings" value="${esc(aq.s)}" data-c=asearch><button class=btn data-a=new>+ New listing</button></div>
<div class=row><span class=mut>${aq.sel.size} selected:</span><button class=chip data-a=bulk data-v=live>Show</button><button class=chip data-a=bulk data-v=hidden>Hide</button><button class=chip data-a=bulk data-v=del>Delete</button><button class=chip data-a=bulk data-v=all>Select page</button></div>
<div class=panel>${l.slice((aq.page-1)*pp,aq.page*pp).map(p=>`<div class=item><input type=checkbox data-c=sel data-v=${p.id} ${aq.sel.has(p.id)?'checked':''}>${p.imgs[0]?`<img src="${p.imgs[0]}">`:'<div class=t0>🧵</div>'}<div class=g><b>${esc(p.title)}</b><div class=mut>${money(p.price)} · ${p.status=='hidden'?'Hidden':'Live'} · ${p.stock===''?'made to order':sold(p)?'sold out':p.stock+' in stock'}${p.cat?' · '+esc(p.cat):''}${(p.opts||[]).length?' · '+p.opts.length+' options':''}${p.custom?' · custom on':''}</div></div><button class=chip data-a=edit data-v=${p.id}>Edit</button><button class=chip data-a=dup data-v=${p.id}>Copy</button></div>`).join('')||'<p class=mut>No listings yet.</p>'}</div>${pager(n,aq.page,'apage')}`}
function form(p){const f=(l,id,v,t='text',x='')=>`<label>${l}<input id="f_${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
return `<div class=panel><h2>${p._new?'New':'Edit'} listing</h2><div class=grid2>${f('Title','title',p.title)}${f('Price','price',p.price,'number','step="0.01" min="0"')}<label>Category<select id=f_cat><option value="">— None —</option>${[...(st().categories||[]),...(p.cat&&!(st().categories||[]).includes(p.cat)?[p.cat]:[])].map(c=>`<option ${c==p.cat?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select><span class=mut>Edit this list under Settings → Categories</span></label>${f('Stock (blank = made to order)','stock',p.stock,'number','min="0"')}</div>
<label>Description<textarea id=f_desc rows=4>${esc(p.desc)}</textarea></label>${f('Stripe Payment Link for this item (blank = use default)','link',p.link,'url','placeholder="https://buy.stripe.com/…"')}
<div class=grid2><label>Status<select id=f_status><option value=live ${p.status!='hidden'?'selected':''}>Live</option><option value=hidden ${p.status=='hidden'?'selected':''}>Hidden</option></select></label><label class=chk><input id=f_feat type=checkbox ${p.featured?'checked':''}> Featured (shown first)</label></div>
<div class=imgs>${p.imgs.map((s,i)=>`<div class=th><img src="${s}"><button data-a=rmimg data-v=${i}>✕</button></div>`).join('')}</div>
<label>Add photos (first photo is the cover)<input type=file id=f_file accept="image/*" multiple data-c=addimg></label>
<h3>Options (patterns, colours…)</h3><p class=mut>Add choices for the same item. Leave price, stock or Stripe link blank to use the item’s own.</p>${(p.opts||[]).map((o,i)=>`<div class=panel><div class=grid2>${f('Option name','o_name_'+i,o.name)}${f('Price','o_price_'+i,o.price,'number','step="0.01" min="0"')}${f('Stock','o_stock_'+i,o.stock,'number','min="0"')}${f('Stripe link','o_link_'+i,o.link,'url')}<label>Photo shown<select id=f_o_img_${i}><option value="">Cover photo</option>${p.imgs.map((s,j)=>`<option value=${j} ${String(o.img)===String(j)?'selected':''}>Photo ${j+1}</option>`).join('')}</select></label></div><button class=chip data-a=rmopt data-v=${i}>Remove option</button></div>`).join('')}<button class=chip data-a=addopt>+ Add option</button>
<h3>Custom designs</h3><label class=chk><input id=f_cust type=checkbox ${p.custom?'checked':''}> Allow custom design requests on this item</label><label>Message shown to shoppers<textarea id=f_cnote rows=2>${esc(p.customNote)}</textarea></label>
<div class=row><button class=btn data-a=saveform>Save listing</button><button class=chip data-a=cancel>Cancel</button>${p._new?'':'<button class=chip data-a=del data-v='+p.id+'>Delete</button>'}</div></div>`}
function settings(){const s=st(),f=(l,id,v,t='text',x='')=>`<label>${l}<input id="s_${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
return `<div class=panel><h2>Shop</h2><div class=grid2>${f('Shop name','name',s.name)}${f('Tagline','tagline',s.tagline)}${f('Contact email','contact',s.contact,'email')}${f('Enquiry email (receives Enquire and custom requests; blank = contact email)','enquiryEmail',s.enquiryEmail,'email')}${f('Currency code (e.g. AUD)','currency',s.currency)}${f('Items per page (shop default)','perPage',s.perPage,'number','min="1"')}${f('Per-page choices for shoppers (comma separated)','perPageOptions',s.perPageOptions)}${f('Items per page (this admin list)','adminPerPage',s.adminPerPage,'number','min="1"')}</div>${f('Notice banner (blank = none)','notice',s.notice)}
<label>Header banner image<input type=file accept="image/*" data-c=hero></label></div>
<div class=panel><h2>Stripe</h2><p class=mut>In your Stripe dashboard create a Payment Link for each product, then paste its link on the listing. The default below is used for any listing without its own link, e.g. a general “pay me” link.</p>${f('Default Stripe Payment Link','stripeLink',s.stripeLink,'url','placeholder="https://buy.stripe.com/…"')}</div>
<div class=panel><h2>Categories</h2><p class=mut>All categories show as filter buttons on the shop unless you set them to Hidden. Hidden categories still appear in the dropdown on each listing.</p>${(s.categories||[]).map((c,i)=>`<div class=item><div class=g><b>${esc(c)}</b> <span class=mut>${S.products.filter(p=>p.cat==c).length} items</span></div><button class=chip data-a=tgcat data-v=${i}>${(s.catsOff||[]).includes(c)?'Hidden':'Shown'}</button><button class=chip data-a=movecat data-v="${i},-1">↑</button><button class=chip data-a=movecat data-v="${i},1">↓</button><button class=chip data-a=rencat data-v=${i}>Rename</button><button class=chip data-a=rmcat data-v=${i}>Remove</button></div>`).join('')||'<p class=mut>No categories yet.</p>'}<div class=row><input id=newcat placeholder="New category name" style="flex:1"><button class=btn data-a=addcat>Add category</button></div></div>
<div class=panel><h2>GitHub connection</h2><p class=mut>Signed in to <b>${esc(GH.repo())}</b>. Changes are saved to this repository when you press Publish, and the live site updates about a minute later.</p><button class=chip data-a=signout>Sign out</button></div>
<button class=btn data-a=saveset>Save settings</button>`}
const val=id=>$('#'+id)?.value??'';
let unlocked=false,idle;const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join(''),ok=()=>isAdmin,bump=()=>{clearTimeout(idle);if(st().pinHash&&unlocked)idle=setTimeout(()=>{unlocked=false;aq.edit=null;render()},6e5)};
['click','keydown'].forEach(e=>addEventListener(e,bump));addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pin')act.unlock()});
function grab(){const p=aq.edit;if(!p||!$('#f_title'))return;Object.assign(p,{title:val('f_title'),price:val('f_price'),cat:val('f_cat'),stock:val('f_stock'),desc:val('f_desc'),link:val('f_link'),status:val('f_status'),featured:$('#f_feat').checked,custom:$('#f_cust').checked,customNote:val('f_cnote')});(p.opts||[]).forEach((o,i)=>{o.name=val('f_o_name_'+i);o.price=val('f_o_price_'+i);o.stock=val('f_o_stock_'+i);o.link=val('f_o_link_'+i);o.img=val('f_o_img_'+i)})}
const bad=u=>u&&!/^https:\/\//i.test(u.trim());
const done=m=>{dirty=true;msg=m;aq.edit=null;render()};
const act={
cat(v){q.cat=v;q.page=1;render()},
custom(v){const p=S.products.find(x=>x.id==v),e=eff(p),t=($('#c_'+v)||{}).value||'';if(!t.trim()){alert('Please describe your custom design first.');return}if(!em()){alert('This shop has no enquiry email set up yet.');return}mail('Custom request: '+p.title,'Item: '+p.title+(e.o?'\nOption: '+e.o.name:'')+'\nPrice shown: '+money(e.price)+'\n\nCustom details:\n'+t)},
enq(v){const p=S.products.find(x=>x.id==v),e=eff(p);if(!em()){alert('This shop has no enquiry email set up yet.');return}mail('Enquiry: '+p.title+(e.o?' – '+e.o.name:''),'Hi, I’d like to ask about:\nItem: '+p.title+(e.o?'\nOption: '+e.o.name:'')+'\nPrice: '+money(e.price)+'\n\n')},
tgcat(i){const s=st(),c=s.categories[i],o=s.catsOff=s.catsOff||[],k=o.indexOf(c);k<0?o.push(c):o.splice(k,1);done(k<0?'Category hidden on the shop.':'Category shown on the shop.')},
addcat(){const v=val('newcat').trim(),c=st().categories;if(!v||c.some(x=>x.toLowerCase()==v.toLowerCase()))return;c.push(v);done('Category added.')},
rencat(i){const c=st().categories,o=c[i],n=(prompt('Rename category',o)||'').trim();if(!n||n==o)return;if(c.some((x,j)=>j!=i&&x.toLowerCase()==n.toLowerCase())){alert('That category already exists.');return}c[i]=n;S.products.forEach(p=>{if(p.cat==o)p.cat=n});st().catsOff=(st().catsOff||[]).map(x=>x==o?n:x);done('Category renamed.')},
rmcat(i){const c=st().categories,o=c[i],k=S.products.filter(p=>p.cat==o).length;if(!confirm('Remove “'+o+'”?'+(k?' '+k+' listing(s) will have no category.':'')))return;S.products.forEach(p=>{if(p.cat==o)p.cat=''});c.splice(+i,1);st().catsOff=(st().catsOff||[]).filter(x=>x!=o);done('Category removed.')},
movecat(v){const[i,d]=v.split(',').map(Number),c=st().categories,j=i+d;if(j<0||j>=c.length)return;[c[i],c[j]]=[c[j],c[i]];done('Order updated.')},
lock(){unlocked=false;aq.edit=null;render()},
async unlock(){const s=st();if(await sha(s.pinSalt+val('pin'))==s.pinHash){unlocked=true;bump();render()}else{await new Promise(r=>setTimeout(r,1500));alert('Wrong PIN.')}},
async setpin(){const v=val('s_pin');if(v.length<6){alert('Use at least 6 characters.');return}const s=st();s.pinSalt=crypto.randomUUID();s.pinHash=await sha(s.pinSalt+v);unlocked=true;bump();done('PIN set — press Publish so it applies on future visits.')},
rmpin(){const s=st();delete s.pinHash;delete s.pinSalt;done('PIN removed — press Publish to apply.')},
addopt(){grab();(aq.edit.opts=aq.edit.opts||[]).push({name:'',price:'',stock:'',link:'',img:''});render()},rmopt(v){grab();aq.edit.opts.splice(+v,1);render()},page(v){q.page=+v;render()},apage(v){aq.page=+v;render()},tab(v){aq.tab=v;aq.edit=null;msg='';render()},
new(){aq.edit={_new:1,id:'p'+Date.now().toString(36),title:'',price:'',cat:'',stock:'',desc:'',link:'',status:'live',featured:false,imgs:[],custom:false,customNote:'',opts:[]};render()},
edit(v){aq.edit=JSON.parse(JSON.stringify(S.products.find(p=>p.id==v)));render()},
dup(v){const p=JSON.parse(JSON.stringify(S.products.find(x=>x.id==v)));p.id='p'+Date.now().toString(36);p.title+=' (copy)';p.status='hidden';S.products.unshift(p);done('Copied as a hidden listing.')},
cancel(){aq.edit=null;render()},rmimg(v){grab();aq.edit.imgs.splice(+v,1);render()},
del(v){if(!confirm('Delete this listing for good?'))return;S.products=S.products.filter(p=>p.id!=v);done('Listing deleted.')},
saveform(){grab();const p=aq.edit;if(!p.title.trim()){alert('Please add a title.');return}if(bad(p.link)||(p.opts||[]).some(o=>bad(o.link))){alert('Stripe links must start with https://');return}
p.price=+p.price||0;p.stock=p.stock===''?'':Math.max(0,+p.stock);const n=p._new;delete p._new;if(n)S.products.unshift(p);else S.products=S.products.map(x=>x.id==p.id?p:x);done('Listing saved — press Publish to make it live.')},
bulk(v){const ids=[...aq.sel];if(v=='all'){const pp=+st().adminPerPage||10;S.products.filter(p=>!aq.s||(p.title+p.cat).toLowerCase().includes(aq.s.toLowerCase())).slice((aq.page-1)*pp,aq.page*pp).forEach(p=>aq.sel.add(p.id));render();return}
if(!ids.length)return;if(v=='del'){if(!confirm('Delete '+ids.length+' listing(s)?'))return;S.products=S.products.filter(p=>!aq.sel.has(p.id))}else S.products.forEach(p=>{if(aq.sel.has(p.id))p.status=v});aq.sel.clear();done('Bulk change applied.')},
saveset(){const s=st();for(const k of ['name','tagline','contact','enquiryEmail','currency','perPage','perPageOptions','adminPerPage','notice','stripeLink'])s[k]=val('s_'+k).trim();
if(bad(s.stripeLink)){alert('Stripe links must start with https://');return}s.adminAccess=val('s_adminAccess')||'owner';s.currency=(s.currency||'AUD').toUpperCase();s.perPage=+s.perPage||12;s.adminPerPage=+s.adminPerPage||10;done('Settings saved — press Publish to make them live.')},
async signin(){const repo=val('ghrepo').trim(),tok=val('ghtok').trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){alert('Enter the repository (like username/repo) and your token.');return}
let r,j={};try{r=await fetch('https://api.github.com/repos/'+repo,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});j=await r.json()}catch(e){alert('Could not reach GitHub.');return}
if(!r.ok||!j.permissions||!j.permissions.push){alert('That token cannot write to '+repo+'. Check the repository name and that the token has Contents: Read and write.');return}
const st_=$('#ghrem').checked?localStorage:sessionStorage;st_.gh=tok;st_.ghr=repo;isAdmin=true;try{const x=await gh('/contents/data.json',{headers:{Accept:'application/vnd.github.raw+json'}});if(x.ok)S=await x.json()}catch(e){}render()},
signout(){if(dirty&&!confirm('You have unpublished changes. Sign out anyway?'))return;['gh','ghr'].forEach(k=>{sessionStorage.removeItem(k);localStorage.removeItem(k)});isAdmin=false;dirty=false;location.hash='';render()},
async publish(){if(!isAdmin)return;const bt=document.querySelector('.pub button'),say=t=>{if(bt)bt.textContent=t};
try{say('Checking…');const ir=await gh('');if(!ir.ok)throw new Error('cannot reach the repository ('+ir.status+'). Check your token.');const br=(await ir.json()).default_branch;
const put=async(path,c,raw)=>{const g=await gh('/contents/'+path+'?ref='+br);const sha=g.ok?(await g.json()).sha:undefined;const r=await gh('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Shop update: '+path,content:raw?c:btoa(unescape(encodeURIComponent(c))),branch:br,sha})});if(!r.ok)throw new Error('could not save '+path+' ('+r.status+')')};
const t=Date.now().toString(36);let n=0;const up=async(d,nm)=>{if(!String(d).startsWith('data:'))return d;say('Uploading photo '+(++n)+'…');await put('images/'+nm+'.jpg',d.split(',')[1],1);return 'images/'+nm+'.jpg'};
const D=JSON.parse(JSON.stringify(S));D.settings.hero=await up(D.settings.hero,'hero-'+t);
for(const p of D.products)for(let i=0;i<p.imgs.length;i++)p.imgs[i]=await up(p.imgs[i],p.id+'-'+t+i);
say('Saving…');await put('data.json',JSON.stringify(D,null,1));S=D;dirty=false;msg='Published. GitHub Pages takes about a minute to update the live site.';render()}
catch(e){alert('Publish failed: '+e.message);say('Publish to shop')}}};
const rs=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const m=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*m;c.height=i.height*m;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(f)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b.dataset.v)});
document.addEventListener('change',async e=>{const t=e.target,c=t.dataset.c;if(!c)return;
if(c=='search'){q.s=t.value;q.page=1;render()}else if(c=='pp'){q.pp=+t.value;q.page=1;render()}else if(c=='asearch'){aq.s=t.value;aq.page=1;render()}
else if(c=='sel'){t.checked?aq.sel.add(t.dataset.v):aq.sel.delete(t.dataset.v)}
else if(c=='opt'){sel[t.dataset.v]=+t.value;render()}
else if(c=='addimg'){grab();for(const f of t.files)aq.edit.imgs.push(await rs(f));render()}
else if(c=='hero'&&t.files[0]){const s=st();s.hero=await rs(t.files[0]);done('Banner updated — press Publish.')}});
function render(){const y=scrollY;$('#root').innerHTML=(ok()&&dirty?`<div class=pub>You have unpublished changes <button data-a=publish>Publish to shop</button></div>`:'')+(location.hash=='#admin'?admin():shop());scrollTo(0,y)}
addEventListener('hashchange',()=>{msg='';render()});render();

</script></body></html>
